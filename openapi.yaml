openapi: 3.0.3
info:
  title: Apigee Proxy Template API
  description: This is a basic OpenAPI specification generated for the project.
  version: 1.0.0
servers:
  - url: https://agriturismi.regione.umbria.it/rest/agriturismiiap/v1
paths:
  /status:
    get:
      summary: Status endpoint
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Hello world"
  /verifica_agriturismo:
    get:
      summary: Verifica agriturismo IAP
      description: Verifica l'iscrizione di un agriturismo tramite CUAA e numero di iscrizione.
      operationId: verificaAgriturismo
      parameters:
        - name: cuaa
          in: query
          description: Codice Unico Azienda Agricola (CUAA)
          required: true
          schema:
            type: string
            example: "01234567890"
        - name: num_iscrizione
          in: query
          description: Numero di iscrizione dell'agriturismo
          required: true
          schema:
            type: string
            example: "12345"
      responses:
        '200':
          description: Risposta restituita con successo dal servizio Mendix
          content:
           application/json:
             schema:
               type: object
               required:
                 - Root_IAP_API
               properties:
                 Root_IAP_API:
                   type: object
                   required:
                     - esito
                     - Dati_Base
                   properties:
                     esito:
                      type: string
                      description: Codice di esito restituito dal servizio Mendix
                      example: "0"
                 Dati_aggiuntivis:
                   type: object
                   properties:
                     Dati_aggiuntivi:
                       type: array
                       items:
                         type: object
                         properties:
                           ult_scia_num:
                             type: string
                             example: "3363"
                           ult_scia_data:
                             type: string
                             example: "18-05-2025"
                           comune:
                             type: string
                             example: "Castel Ritaldi"
                           provincia:
                             type: string
                             example: "PG"
                 Dati_Base:
                   type: object
                   properties:
                      giornate_agrituristiche:
                        type: string
                        example: "477.3"
                      stato:
                        type: string
                        example: "ATTIVA"
                      numero_iscrizione:
                        type: string
                        example: "4261"
                      cuaa:
                        type: string
                        example: "BCCFNC94B04D653U"
             example:
               Root_IAP_API:
                 esito: "0"
                 Dati_aggiuntivis:
                   Dati_aggiuntivi:
                     - ult_scia_num: "3363"
                       ult_scia_data: "18-05-2025"
                       comune: "Castel Ritaldi"
                       provincia: "PG"
                 Dati_Base:
                   giornate_agrituristiche: "477.3"
                   stato: "ATTIVA"
                   numero_iscrizione: "4261"
                   cuaa: "BCCFNC94B04D653U"
        '400':
          description: Parametri di richiesta mancanti o non validi
        '401':
          description: Token o credenziali di accesso al proxy non validi
        '500':
          description: Errore interno del proxy o del backend Mendix